org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler tries to express plugin source paths (in the
# pub cache) relative to this project's directory for its "relocatable"
# cache. On Windows, when the project and the pub/Gradle caches live on
# different drive letters (e.g. project on D:, caches on C: under the user
# profile), that relative-path computation has no valid result and crashes
# every Android build with "this and base files have different roots".
# Disabling Kotlin incremental compilation avoids computing that path at
# all — clean-ish rebuilds are a bit slower, but plugin Kotlin shims are
# tiny, so this isn't noticeable in practice.
kotlin.incremental=false
